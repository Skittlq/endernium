plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def targetJavaVersion = 26

sourceSets {
	main {
		java {
			srcDir "../common/src/main/java"
		}
		resources {
			srcDir "../common/src/main/resources"
			srcDir "src/generated/resources"
			exclude ".cache/**"
		}
	}
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

fabricApi {
	configureDataGeneration {
		outputDirectory = file("src/generated/resources")
		addToResources = false
		createSourceSet = false
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
}

tasks.withType(AbstractArchiveTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def modName = project.name
	def modLoader = "fabric"
	def mcVersion = project.minecraft_version
	def modVersion = project.mod_version
	archiveBaseName.set("${modName}_${modLoader}_${mcVersion}")
	archiveVersion.set("${modVersion}")
}

tasks.matching { it.name == "jar" || it.name == "remapJar" }.configureEach {
	archiveFileName.set("${project.name}_fabric_${project.minecraft_version}_${project.mod_version}.jar")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}

	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
    def projectVersion = project.version
    inputs.property "projectVersion", projectVersion

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
